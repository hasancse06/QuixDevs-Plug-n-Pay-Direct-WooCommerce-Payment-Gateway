name: Local contracts and distribution policy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer test-packaging
      - run: php tests/direct-access.php
      - run: php tests/missing-dependency.php
      - run: php tests/missing-key.php
      - run: composer secrets
      - run: composer docs
      - run: composer repository-check
      - run: python3 tools/check-repository.py --snapshot-check
      - run: composer package-check
      - name: Enforce WordPress coding standards and retain the report
        run: |
          mkdir -p docs/verification
          python3 tools/run-phpcs.py > docs/verification/phpcs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: wordpress-standards-php-${{ matrix.php }}
          path: docs/verification/phpcs.json
# Plugin Check needs an actual disposable WP/WC installation plus Plugin Check;
# run tools/plugin-check.sh there. No decorative unprovisioned job is enabled.
# No release/deploy job, merchant credentials, live API calls or public packaging.
